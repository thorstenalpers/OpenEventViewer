[package]
name = "openeventviewer"
version = "0.1.0"
description = "Read the Windows event logs, filter them down to what matters, and ask an assistant what a run of them means"
authors = ["thorstenalpers"]
repository = "https://github.com/thorstenalpers/OpenEventViewer"
license = "MIT"
edition = "2021"

[lib]
name = "openeventviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `windows-native` puts the key in the Windows Credential Manager rather than in a file this app
# would then own the protection of.
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = [
	"blocking",
	"json",
	"rustls",
] }
chrono = "0.4"
roxmltree = "0.20"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	# EvtFormatMessage takes EVT_VARIANT, which lives behind the security feature.
	"Win32_Security",
	"Win32_System_EventLog",
] }
