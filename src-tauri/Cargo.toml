[package]
name = "openeventviewer"
version = "1.0.0"
description = "Read the Windows event logs and filter them down to what matters"
authors = ["thorstenalpers"]
repository = "https://github.com/thorstenalpers/OpenEventViewer"
license = "MIT"
edition = "2021"

[lib]
name = "openeventviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# Only for the relaunch after an update is installed.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
roxmltree = "0.20"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	# EvtFormatMessage takes EVT_VARIANT, which lives behind the security feature.
	"Win32_Security",
	"Win32_System_EventLog",
] }
