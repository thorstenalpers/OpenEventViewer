name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-

      # Before the six-minute build rather than after it. With no key the bundler is handed an
      # empty string, tries to parse it as a minisign secret and reports it as a malformed one --
      # which reads as "your key is broken" when the truth is "there is no key".
      - name: Check there is something to sign with
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $missing = @()
          if (-not $env:KEY) { $missing += 'the secret TAURI_SIGNING_PRIVATE_KEY' }
          $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $pubkey) { $missing += 'plugins.updater.pubkey in src-tauri/tauri.conf.json' }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Nothing to sign with. Missing: $($missing -join '; ')."
            Write-Host ''
            Write-Host 'Generate the pair once, on a machine you trust:'
            Write-Host '  npx tauri signer generate -w openeventviewer.key'
            Write-Host ''
            Write-Host 'Commit the public half into plugins.updater.pubkey, then add the private'
            Write-Host 'half as the secret TAURI_SIGNING_PRIVATE_KEY and its password as'
            Write-Host 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The private half never enters the repo.'
            exit 1
          }
          Write-Host 'Signing key and public key are both in place.'

      - run: npm ci

      # Regenerated rather than trusted: the notices ship inside the installer because MIT, BSD and
      # ISC all require the notice to accompany the distribution, and a stale file quietly stops
      # naming a dependency that was added after it was last written.
      # `npm run licenses` shells out to `cargo license`, which no runner image carries. Without it
      # the notices cannot be regenerated, and they are what the licences require to ship.
      # The check above cannot tell a wrong password from a right one -- only that a key is there.
      # Signing a throwaway file can, and it costs a second against six minutes of build before the
      # bundler reaches the same conclusion. The signature is public; the key never leaves the env.
      - name: Check the key and its password sign something
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Set-Content -Path signing-probe.txt -Value 'probe'
          npx tauri signer sign signing-probe.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::The key and TAURI_SIGNING_PRIVATE_KEY_PASSWORD do not match. Set the password the key was generated with, or generate a new pair and update plugins.updater.pubkey with its public half.'
            exit 1
          }
          Remove-Item signing-probe.txt, signing-probe.txt.sig -ErrorAction SilentlyContinue
          Write-Host 'Key and password agree.'

      - name: Install cargo-license
        run: cargo install cargo-license --locked

      - run: npm run licenses

      # The private half of the minisign key pair whose public half is in tauri.conf.json. Without
      # both secrets the build produces an installer with no `.sig`, and the updater refuses an
      # unsigned one — which is the whole point of signing it.
      - name: Build the installer and its signature
        run: npm run app:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # `latest.json` is what the updater endpoint serves. Written here rather than by hand so the
      # signature in it is the one that belongs to the installer beside it.
      - name: Write latest.json
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $signature = Get-Content "$($setup.FullName).sig" -Raw
          $version = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($setup.Name)"
          $manifest = [ordered]@{
            version   = $version
            notes     = "See the release notes for $version."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{ signature = $signature.Trim(); url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File latest.json -Encoding utf8

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            latest.json
          fail_on_unmatched_files: true
